[package]
name = "snipforge-desktop"
version = "0.1.0"
edition = "2021"
description = "SnipForge Desktop — AI-powered code snippet manager"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
snipforge-core = { path = "../../crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs-next = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "snipforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
